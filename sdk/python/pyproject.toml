[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aktor"
version = "0.1.0"
description = "Python client for the Aktor Agents platform (tasks, workspaces, solutions, records, end users) and a server for remote plugins."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["aktor"]
