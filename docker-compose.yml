services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aktor_agents}
      POSTGRES_USER: ${POSTGRES_USER:-aktor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aktor_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aktor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aktor_agents};Username=${POSTGRES_USER:-aktor};Password=${POSTGRES_PASSWORD:-aktor_dev_password}"
      Tools__DatabaseConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-aktor_agents};Username=${POSTGRES_USER:-aktor};Password=${POSTGRES_PASSWORD:-aktor_dev_password}"
      Llm__Provider: ${LLM_PROVIDER:-Mock}
      Llm__Model: ${LLM_MODEL:-claude-sonnet-5}
      Llm__ApiKey: ${LLM_API_KEY:-}
      # Ollama: blank means the Docker host (http://host.docker.internal:11434); use
      # http://ollama:11434 with the bundled `ollama` profile below.
      Llm__BaseUrl: ${LLM_BASE_URL:-}
      Llm__ContextLength: ${LLM_CONTEXT_LENGTH:-16384}
      Llm__TimeoutSeconds: ${LLM_TIMEOUT_SECONDS:-300}
      Llm__DisableThinking: ${LLM_DISABLE_THINKING:-true}
      # Token efficiency (docs/efficiency.md): a cheaper model for routine event handling and
      # history summaries, e.g. claude-haiku-4-5 / gpt-4o-mini. Empty = use LLM_MODEL everywhere.
      Llm__FastModel: ${LLM_FAST_MODEL:-}
      Tools__SearchProvider: ${SEARCH_PROVIDER:-Tavily}
      Tools__SearchApiKey: ${SEARCH_API_KEY:-}
      # Integrations (docs/plugins.md). The vault key encrypts connection secrets: set
      # SECRETS_MASTER_KEY (openssl rand -base64 32) in production; otherwise one is generated
      # into the api-keys volume on first start — back that volume up.
      Secrets__MasterKey: ${SECRETS_MASTER_KEY:-}
      Secrets__KeyFile: /app/keys/secrets-master.key
      Integrations__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Integrations__AllowStdioMcp: ${ALLOW_STDIO_MCP:-false}
      Plugins__Directory: /app/plugins
      Cors__AllowedOrigins__0: "http://localhost:3000"
    # Makes host.docker.internal resolve on Linux Docker too (Docker Desktop already provides it),
    # so the API can reach an Ollama server running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Lets the API's shell_exec tool launch sandboxed sibling containers on the host's Docker
      # daemon ("Docker outside of Docker") rather than needing Docker-in-Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-workspace:/app/workspace
      - api-keys:/app/keys
      # Drop third-party plugin DLLs here (trusted code only).
      - ./plugins:/app/plugins:ro

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5080}
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Optional bundled Ollama (CPU unless your Docker has GPU support). Start it with
  #   docker compose --profile ollama up -d --build
  # and set LLM_BASE_URL=http://ollama:11434 in .env. Pull a model into it with
  #   docker compose exec ollama ollama pull qwen2.5:7b
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  agent-workspace:
  api-keys:
  ollama-data:
