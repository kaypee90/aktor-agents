name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build AktorAgents.slnx -c Release

      - name: Unit tests
        run: dotnet test src/AgentRuntime.Tests -c Release --no-build

      # Includes the API tests against a throwaway pgvector container (Docker is available on
      # GitHub's Ubuntu runners) and the eval baseline check on the Mock provider.
      - name: Integration tests
        run: dotnet test src/AgentRuntime.IntegrationTests -c Release --no-build

      - name: Eval against the baseline (Mock provider)
        run: >
          dotnet run --project src/AgentRuntime.Evals -c Release --no-build --
          --spec evals/demo-scenarios.json --out evals/reports/ci --baseline evals/baseline/report.json
          --set Llm:Provider=Mock --runs 2

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: TypeScript SDK typecheck
        working-directory: sdk/typescript
        run: npx -y -p typescript@5.6.3 tsc -p tsconfig.json --noEmit
      - name: Node plugin helper and the aktor CLI
        run: |
          node --test sdk/typescript/test/plugin.test.mjs
          node sdk/typescript/bin/aktor.mjs help > /dev/null
          node sdk/typescript/bin/aktor.mjs init "$RUNNER_TEMP/scaffold" > /dev/null
          test -f "$RUNNER_TEMP/scaffold/aktor.yaml"
      - name: Python SDK tests
        run: python -I -m unittest discover -s sdk/python/tests -v
